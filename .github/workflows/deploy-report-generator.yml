name: Deploy report-generator to AWS

on:
  push:
    branches: [main]
    paths:
      - 'report-generator/**'
      - '.github/workflows/deploy-report-generator.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Se exponen como env porque `secrets` no está permitido dentro de un `if:`.
    # GitHub enmascara sus valores en los logs.
    env:
      API_NOTIFICATION: ${{ secrets.API_NOTIFICATION }}
      API_TOKEN_INTEGRATION: ${{ secrets.API_TOKEN_INTEGRATION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: report-generator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: report-generator/package-lock.json

      - name: Install deps (prod only)
        run: npm ci --omit=dev

      - name: Build zip
        run: |
          zip -r ../generator-function.zip . -x "*.git*" "*.DS_Store*"
          ls -lh ../generator-function.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_GENERATOR_FUNCTION_NAME }}" \
            --zip-file "fileb://../generator-function.zip"

          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_GENERATOR_FUNCTION_NAME }}"

      # Los secrets de GitHub solo existen en el workflow: la Lambda los necesita como variables de entorno.
      # OJO: update-function-configuration reemplaza TODAS las variables, por eso se envían las tres juntas.
      - name: Update Lambda env (API de avisos y base de datos)
        if: ${{ env.API_NOTIFICATION != '' && env.API_TOKEN_INTEGRATION != '' && env.DATABASE_URL != '' }}
        run: |
          jq -n --arg api "$API_NOTIFICATION" --arg token "$API_TOKEN_INTEGRATION" --arg db "$DATABASE_URL" \
            '{Variables: {API_NOTIFICATION: $api, API_TOKEN_INTEGRATION: $token, DATABASE_URL: $db}}' > "$RUNNER_TEMP/env.json"
          aws lambda update-function-configuration \
            --function-name "${{ secrets.LAMBDA_GENERATOR_FUNCTION_NAME }}" \
            --environment "file://$RUNNER_TEMP/env.json" > /dev/null
          rm -f "$RUNNER_TEMP/env.json"

      - name: Aviso si faltan secrets
        if: ${{ env.API_NOTIFICATION == '' || env.API_TOKEN_INTEGRATION == '' || env.DATABASE_URL == '' }}
        run: echo "::warning::Faltan secrets (API_NOTIFICATION, API_TOKEN_INTEGRATION y/o DATABASE_URL). La Lambda se desplegó, pero conserva las variables de entorno anteriores."
