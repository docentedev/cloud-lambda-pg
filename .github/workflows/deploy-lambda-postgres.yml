name: Deploy lambda-postgres to AWS

on:
  push:
    branches: [main]
    paths:
      - 'lambda-postgres/**'
      - '.github/workflows/deploy-lambda-postgres.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda-postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lambda-postgres/package-lock.json

      - name: Install deps (prod only)
        run: npm ci --omit=dev

      - name: Build zip (lo que hoy haces a mano)
        run: |
          zip -r ../function.zip . -x "*.git*" "*.DS_Store*"
          ls -lh ../function.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file "fileb://../function.zip"

          # Espera a que termine la actualización de código
          # antes de tocar la configuración (si no, falla con "busy")
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}"

      # Opcional: si guardas el connection string como secret,
      # esto lo deja como variable de entorno en la Lambda.
      # Si no usas DATABASE_URL, borra este paso.
      - name: Update Lambda env (DATABASE_URL)
        if: ${{ secrets.DATABASE_URL != '' }}
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --environment "Variables={DATABASE_URL=${{ secrets.DATABASE_URL }}}"
